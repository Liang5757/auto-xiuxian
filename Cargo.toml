[package]
name = "xiuxian"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts","glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = {version="0.52",features=["Win32_System_SystemInformation","Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_UI_Input_KeyboardAndMouse","Win32_UI_HiDpi"]}


[features]
admin = []
