[workspace]
members = ["core", "app-server", "app-server-protocol"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.52"

[workspace.lints.clippy]
too_many_lines = "deny"
